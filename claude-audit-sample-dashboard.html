<style>

    --accent: #1f6feb;

    --major: #ea580c;
    --minor: #ca8a04;
    --info: #2563eb;
    --pass: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #161a21;
      --ink: #e7e9ee;
      --muted: #9aa3b2;
      --line: #232833;
      --accent: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);

  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .score-cell {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--card);
  }
  .score-cell .dim { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .score-cell .val { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .score-cell .bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .score-cell .fill { height: 100%; border-radius: 4px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 12px;
  }
  .chip {
    padding: 5px 11px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer; user-select: none;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .search {
    flex: 1; min-width: 200px;
    padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 13px;
  }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .findings { display: flex; flex-direction: column; gap: 10px; }
  .finding {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .finding header.f-head {
    display: flex; gap: 10px; align-items: baseline; margin: 0 0 4px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    color: #fff;
  }
  .badge.critical { background: var(--critical); }
  .badge.major { background: var(--major); }
  .badge.minor { background: var(--minor); }
  .badge.info { background: var(--info); }
  .dim-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .f-title { font-weight: 600; }
  .f-loc { color: var(--muted); font-size: 12px; }
  .f-evidence {
    margin: 6px 0 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--muted);
    white-space: pre-wrap; word-break: break-word;
  }
  .f-fix { margin-top: 8px; font-size: 13px; }
  .f-fix b { color: var(--pass); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] > summary .chev { transform: rotate(90deg); }
  .chev { display: inline-block; transition: transform 0.15s; color: var(--muted); }
  .footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 30px; }
</style>
</head>

const SEVERITY_ORDER = ["critical", "major", "minor", "info"];
const DIMENSIONS = ["seo", "performance", "accessibility", "security", "ai-slop", "brand", "claude-md"];

const STORAGE_KEY = "claudeAuditFilters_v1";
const state = {
  dims: new Set(DIMENSIONS),
  sevs: new Set(SEVERITY_ORDER),
  q: "",
};
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  if (saved) {
    if (Array.isArray(saved.dims)) state.dims = new Set(saved.dims);
    if (Array.isArray(saved.sevs)) state.sevs = new Set(saved.sevs);
    if (typeof saved.q === "string") state.q = saved.q;
  }
} catch (e) { /* ignore */ }

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      dims: [...state.dims], sevs: [...state.sevs], q: state.q,
    }));
  } catch (e) { /* ignore */ }
}

function renderMeta() {
  if (!DATA) return;
  const total = (DATA.findings || []).length;
  const counts = { critical: 0, major: 0, minor: 0, info: 0 };
  for (const f of DATA.findings || []) {
    if (counts[f.severity] !== undefined) counts[f.severity]++;
  }
  document.getElementById("meta-line").textContent =
    `Run: ${DATA.scanned_at}  ·  Files scanned: ${DATA.files_scanned}  ·  ` +
    `Findings: ${total} (${counts.critical} critical, ${counts.major} major, ` +
    `${counts.minor} minor, ${counts.info} info)`;
}

function scoreColor(score) {
  if (score >= 90) return "#16a34a";
  if (score >= 75) return "#84cc16";
  if (score >= 60) return "#ca8a04";
  if (score >= 40) return "#ea580c";
  return "#dc2626";
}

function renderScores() {
  const wrap = document.getElementById("scores");
  wrap.innerHTML = "";
  const scores = (DATA && DATA.scores) || {};
  for (const d of DIMENSIONS) {
    const v = scores[d] !== undefined ? scores[d] : 100;
    const cell = document.createElement("div");
    cell.className = "score-cell";
    cell.innerHTML = `
      <div class="dim">${d}</div>
      <div class="val" style="color:${scoreColor(v)}">${v}</div>
      <div class="bar"><div class="fill" style="width:${v}%; background:${scoreColor(v)}"></div></div>
    `;
    wrap.appendChild(cell);
  }
}

function makeChip(label, on, onclick) {
  const c = document.createElement("button");
  c.className = "chip";
  c.textContent = label;
  c.setAttribute("aria-pressed", on ? "true" : "false");
  c.addEventListener("click", onclick);
  return c;
}

function renderChips() {
  const dimWrap = document.getElementById("dim-chips");
  dimWrap.innerHTML = "";
  for (const d of DIMENSIONS) {
    const on = state.dims.has(d);
    dimWrap.appendChild(makeChip(d, on, () => {
      if (state.dims.has(d)) state.dims.delete(d); else state.dims.add(d);
      persist(); renderChips(); renderFindings();
    }));
  }
  const sevWrap = document.getElementById("sev-chips");
  sevWrap.innerHTML = "";
  for (const s of SEVERITY_ORDER) {
    const on = state.sevs.has(s);
    sevWrap.appendChild(makeChip(s, on, () => {
      if (state.sevs.has(s)) state.sevs.delete(s); else state.sevs.add(s);
      persist(); renderChips(); renderFindings();
    }));
  }
}

function passesFilters(f) {
  if (!state.dims.has(f.dimension)) return false;
  if (!state.sevs.has(f.severity)) return false;
  if (state.q) {
    const hay = `${f.title} ${f.file} ${f.evidence || ""} ${f.fix || ""}`.toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function renderFindings() {
  const wrap = document.getElementById("findings");
  wrap.innerHTML = "";
  const items = (DATA && DATA.findings) || [];
  const visible = items.filter(passesFilters)
    .sort((a, b) => SEVERITY_ORDER.indexOf(a.severity) - SEVERITY_ORDER.indexOf(b.severity));
  document.getElementById("count").textContent =
    `${visible.length} of ${items.length} findings`;
  if (visible.length === 0) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No findings match the current filters.";
    wrap.appendChild(e);
    return;
  }
  for (const f of visible) {
    const el = document.createElement("article");
    el.className = "finding";
    el.innerHTML = `
      <header class="f-head">
        <span class="badge ${f.severity}">${f.severity}</span>
        <span class="dim-badge">${f.dimension}</span>
        <span class="f-title"></span>
        <span class="f-loc"></span>
      </header>
      ${f.evidence ? `<pre class="f-evidence"></pre>` : ""}
      ${f.fix ? `<div class="f-fix"><b>Fix:</b> <span class="fix-text"></span></div>` : ""}
    `;
    el.querySelector(".f-title").textContent = f.title;
    el.querySelector(".f-loc").textContent =
      f.file + (f.line ? `:${f.line}` : "");
    if (f.evidence) el.querySelector(".f-evidence").textContent = f.evidence;
    if (f.fix) el.querySelector(".fix-text").textContent = f.fix;
    wrap.appendChild(el);
  }
}

document.getElementById("search").value = state.q;
document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value;
  persist();
  renderFindings();
});

renderMeta();
renderScores();
renderChips();
renderFindings();
</script>
